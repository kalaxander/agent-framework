name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    name: Dependency-free smoke tests (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run smoke test suite
        run: python3 tests/smoke_test.py

  pytest-suite:
    name: pytest suite (Phase 1 core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          cd sdk
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/test_flow_and_executor.py -v

  server-integration:
    name: Real FastAPI integration tests (non-stubbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install server dependencies
        run: |
          cd sdk
          pip install -e ".[server]"
          pip install httpx pytest
      - name: Run server integration tests
        run: pytest tests/test_server_integration.py -v
